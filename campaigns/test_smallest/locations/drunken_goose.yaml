id: drunken_goose
name: The Drunken Goose
type: building
parent_id: null
description: >
  A low-ceilinged tavern in the village of Millhaven. Smells of tallow and old ale.
  Rough-hewn tables, a long oak bar, and a fire that never quite catches properly.
  The kind of place where secrets get told to the bottom of a tankard.
