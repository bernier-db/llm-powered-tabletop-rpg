id: barkeep_marta
name: Marta Voss
role: Barkeep of the Drunken Goose
personality: >
  Guarded and practical. Deeply loyal to the village of Millhaven. Does not trust
  strangers quickly. Speaks in short sentences. Rarely volunteers information.
voice_register: >
  Short declarative sentences. Rarely asks questions back. Says "aye" instead of
  "yes." Avoids eye contact when lying or withholding. Cleans things compulsively
  when nervous.
speech_sample: |
  "Aye, she's a hard season. Always is, this close to harvest."
  She sets a tankard down without looking up. "You want something, or you just passing through?"
  A pause. The rag moves in slow circles. "Missing? Four of 'em from the eastern fields. Terrible thing."
secrets:
  - She saw robed figures take her nephew Torvald three nights ago from behind the mill. She recognised the smell of burnt pine resin — unusual, distinctive.
  - She has not told the village elder because the cultists left a note threatening her remaining family if she spoke to anyone in authority.
knowledge:
  - At least four farmhands have gone missing from the eastern fields over the past two weeks.
  - Strange lights have been seen near the old mill at night for the past month.
  - The village elder Brynn Holle has sent a rider to the city, but no help has come.
  - Trade caravans have been avoiding Millhaven; the rumour-mill says the road east is cursed.
